<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remaining Shelf Life Dashboard — Honasa FRK</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--bg:#f3f5f9;--card:#fff;--bd:#d9dfea;--tx:#17202e;--mu:#6b778c;--ac:#1a73e8;
        --c-exp:#7a1f2b;--c30:#d93b4f;--c60:#f08c00;--c90:#e6b800;--c90p:#1e9e5a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:1280px;margin:0 auto}
  .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:20px;margin:0}
  .sub{font-size:13px;color:var(--mu);margin-top:3px}
  button{font-size:14px;font-weight:600;border:none;border-radius:9px;padding:9px 14px;cursor:pointer;background:var(--ac);color:#fff}
  button.sec{background:#e8ecf4;color:var(--tx)}
  button:disabled{opacity:.5;cursor:wait}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
  .kc{background:var(--card);border:2px solid var(--bd);border-top:6px solid var(--k);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--tx);font-weight:400}
  .kc.on{border-color:var(--k);box-shadow:0 0 0 2px var(--k) inset}
  .kc .t{font-size:12px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .kc .n{font-size:30px;font-weight:800;margin:4px 0 0;color:var(--k)}
  .kc .u{font-size:13px;color:var(--mu)}
  .kc .r{font-size:11px;color:var(--mu);margin-top:2px}
  .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#e8ecf4;margin-bottom:14px}
  .bar div{height:100%}
  .panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .filters input,.filters select{font-size:14px;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:#fff;min-width:140px}
  .filters input{flex:1;min-width:200px}
  .tw{overflow:auto;max-height:68vh;border:1px solid var(--bd);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{position:sticky;top:0;background:#eef2f9;text-align:left;padding:9px 10px;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--bd)}
  td{padding:8px 10px;border-bottom:1px solid #eef1f6;white-space:nowrap}
  td.num,th.num{text-align:right}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;color:#fff;font-size:12px;font-weight:700}
  .msg{padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:10px}
  .msg.er{background:#fde8eb;color:#d93b4f}
  .foot{font-size:12px;color:var(--mu);margin-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
  @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="hd">
  <div>
    <h1>⏳ Remaining Shelf Life Dashboard</h1>
    <div class="sub" id="sub">Honasa Audit — Nov-FRK · Audit Entries</div>
  </div>
  <div class="row">
    <button class="sec" id="rf" onclick="load()">🔄 Refresh</button>
    <button onclick="dlCsv()">⬇ CSV</button>
    <button onclick="dlXlsx()">⬇ Excel</button>
  </div>
</div>

<div id="err"></div>
<div class="cards" id="cards"></div>
<div class="bar" id="bar"></div>

<div class="panel">
  <div class="filters">
    <input id="q" placeholder="Search EAN / Shelf / Auditor / Bin ID" oninput="LIM=300;draw()">
    <select id="aud" onchange="LIM=300;draw()"><option value="">All Auditors</option></select>
    <button class="sec" onclick="resetF()">Clear filters</button>
  </div>
  <div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  <div class="foot"><span id="cnt"></span><button class="sec" id="more" style="display:none" onclick="LIM+=300;draw()">Show more</button></div>
</div>

<script>
// ================= CONFIG =================
const SHEET_ID = '1JqfoLm8o5mJ3-OQIlj1gqk75vHK5Q9952N0Ejw8BouI';
const TAB = 'Audit Entries';
const REFRESH_MS = 5 * 60 * 1000;
// Expiry MM/YYYY = us mahine ke LAST din tak valid (sheet ke column N jaisa hi).
// ==========================================

const BUCKETS = [
  { k:'exp',  label:'Expired',            sub:'Expiry nikal chuki', color:'var(--c-exp)', test:d => d < 0 },
  { k:'30',   label:'Less than 30 days',  sub:'0 – 29 days',        color:'var(--c30)',   test:d => d >= 0 && d < 30 },
  { k:'60',   label:'Less than 60 days',  sub:'30 – 59 days',       color:'var(--c60)',   test:d => d >= 30 && d < 60 },
  { k:'90',   label:'Less than 90 days',  sub:'60 – 89 days',       color:'var(--c90)',   test:d => d >= 60 && d < 90 },
  { k:'90p',  label:'Above 90 days',      sub:'90+ days',           color:'var(--c90p)',  test:d => d >= 90 }
];
const COLS = [
  ['shelf','Shelf'],['ean','EAN'],['mrp','MRP','num'],['qty','Total QTY','num'],['mfgT','MFG'],['expT','Expiry'],
  ['slife','Shelf Life (Months)','num'],['days','Remaining (Days)','num'],['bucketL','Status'],['auditor','Auditor'],['binId','Bin ID'],['tsT','Scanned At']
];

let ROWS = [], FB = 'all', SK = 'days', SD = 1, LIM = 300, NOEXP = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n).toLocaleString('en-IN');

function cellVal(c){ return c ? (c.v != null ? c.v : null) : null; }

// gviz date: "Date(2027,2,1)" (month 0-based) ya text "03/2027"
function parseMonthYear(c){
  if (!c) return null;
  const v = c.v;
  if (typeof v === 'string') {
    let m = /^Date\((\d+),(\d+),(\d+)/.exec(v);
    if (m) return { y:+m[1], m:+m[2] + 1 };
    m = /^(\d{1,2})\/(\d{4})$/.exec(v.trim());
    if (m) return { y:+m[2], m:+m[1] };
  }
  if (typeof c.f === 'string') {
    const m = /^(\d{1,2})\/(\d{4})$/.exec(c.f.trim());
    if (m) return { y:+m[2], m:+m[1] };
  }
  return null;
}
const mm = o => o ? String(o.m).padStart(2,'0') + '/' + o.y : '';

function parseTs(c){
  if (!c) return '';
  if (c.f) return c.f;
  const m = /^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?/.exec(String(c.v || ''));
  if (!m) return String(c.v || '');
  const p = x => String(x || 0).padStart(2,'0');
  return p(m[3]) + '-' + p(+m[2] + 1) + '-' + m[1] + (m[4] != null ? ' ' + p(m[4]) + ':' + p(m[5]) + ':' + p(m[6]) : '');
}

function findCol(cols, test, fallback){
  const i = cols.findIndex(c => test((c.label || '').toLowerCase().trim()));
  return i >= 0 ? i : fallback;
}

async function load(){
  $('rf').disabled = true; $('err').innerHTML = '';
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(TAB)}&_=${Date.now()}`;
    const txt = await (await fetch(url, { cache:'no-store' })).text();
    const j = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
    if (j.status === 'error') throw new Error((j.errors && j.errors[0] && j.errors[0].detailed_message) || 'Sheet read error');
    const cols = j.table.cols;
    const ix = {
      ts: findCol(cols, l => l === 'timestamp' || l === 'date', 0),
      auditor: findCol(cols, l => l === 'auditor', 1),
      shelf: findCol(cols, l => l === 'shelf', 2),
      ean: findCol(cols, l => l === 'ean', 3),
      mrp: findCol(cols, l => l === 'mrp', 4),
      qty: findCol(cols, l => l === 'total qty', 8),
      binId: findCol(cols, l => l === 'bin id', 9),
      mfg: findCol(cols, l => l.includes('mfg'), 10),
      exp: findCol(cols, l => l.includes('expiry') && !l.includes('remaining'), 11),
      slife: findCol(cols, l => l.includes('shelf life') && !l.includes('remaining'), 12)
    };
    const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    ROWS = []; NOEXP = 0;
    (j.table.rows || []).forEach(r => {
      const c = r.c || [];
      const ean = cellVal(c[ix.ean]);
      if (ean == null || String(ean).toLowerCase() === 'ean') return;
      const exp = parseMonthYear(c[ix.exp]), mfg = parseMonthYear(c[ix.mfg]);
      let days = null, b = null;
      if (exp) {
        const end = new Date(exp.y, exp.m, 0);                 // expiry month ka last din
        days = Math.round((end - today) / 86400000);
        b = BUCKETS.find(x => x.test(days));
      } else NOEXP++;
      ROWS.push({
        shelf: cellVal(c[ix.shelf]) || '', ean: String(ean), mrp: Number(cellVal(c[ix.mrp])) || 0,
        qty: Number(cellVal(c[ix.qty])) || 0, mfgT: mm(mfg), expT: mm(exp),
        slife: cellVal(c[ix.slife]) != null && cellVal(c[ix.slife]) !== '' ? Number(cellVal(c[ix.slife])) : (mfg && exp ? (exp.y - mfg.y) * 12 + (exp.m - mfg.m) : ''),
        days, bucket: b ? b.k : '', bucketL: b ? b.label : 'No expiry date',
        auditor: cellVal(c[ix.auditor]) || '', binId: cellVal(c[ix.binId]) || '', tsT: parseTs(c[ix.ts])
      });
    });
    const keep = $('aud').value;
    const auds = [...new Set(ROWS.map(r => r.auditor).filter(Boolean))].sort();
    $('aud').innerHTML = '<option value="">All Auditors</option>' + auds.map(a => `<option ${a === keep ? 'selected' : ''}>${esc(a)}</option>`).join('');
    $('sub').textContent = `Honasa Audit — Nov-FRK · Audit Entries · updated ${new Date().toLocaleTimeString('en-IN')}`;
  } catch (e) {
    $('err').innerHTML = `<div class="msg er">Data load nahi hua: ${esc(e.message)}. Sheet "Anyone with the link → Viewer" share honi chahiye.</div>`;
  }
  $('rf').disabled = false;
  draw();
}

function filtered(){
  const q = $('q').value.trim().toLowerCase(), a = $('aud').value;
  return ROWS.filter(r =>
    (FB === 'all' || r.bucket === FB) &&
    (!a || r.auditor === a) &&
    (!q || (r.ean + ' ' + r.shelf + ' ' + r.auditor + ' ' + r.binId).toLowerCase().includes(q)));
}

function draw(){
  // cards (auditor/search filter ke hisaab se, bucket filter ke bina)
  const q = $('q').value.trim().toLowerCase(), a = $('aud').value;
  const base = ROWS.filter(r => (!a || r.auditor === a) && (!q || (r.ean + ' ' + r.shelf + ' ' + r.auditor + ' ' + r.binId).toLowerCase().includes(q)));
  const withExp = base.filter(r => r.bucket);
  const totQ = withExp.reduce((s, r) => s + r.qty, 0) || 1;
  $('cards').innerHTML = BUCKETS.map(b => {
    const rs = base.filter(r => r.bucket === b.k), qt = rs.reduce((s, r) => s + r.qty, 0);
    return `<button class="kc ${FB === b.k ? 'on' : ''}" style="--k:${b.color}" onclick="setB('${b.k}')">
      <div class="t">${b.label}</div><div class="n">${fmt(qt)}</div>
      <div class="u">units · ${fmt(rs.length)} EAN lines</div><div class="r">${b.sub}</div></button>`;
  }).join('');
  $('bar').innerHTML = BUCKETS.map(b => {
    const qt = withExp.filter(r => r.bucket === b.k).reduce((s, r) => s + r.qty, 0);
    return `<div style="width:${qt / totQ * 100}%;background:${b.color}" title="${b.label}: ${fmt(qt)}"></div>`;
  }).join('');

  // table
  let rs = filtered();
  rs.sort((x, y) => {
    let A = x[SK], B = y[SK];
    const an = A === null || A === '', bn = B === null || B === '';
    if (an && bn) return 0; if (an) return 1; if (bn) return -1;
    if (typeof A === 'number' && typeof B === 'number') return (A - B) * SD;
    return String(A).localeCompare(String(B), undefined, { numeric:true }) * SD;
  });
  $('th').innerHTML = '<tr>' + COLS.map(c => `<th class="${c[2] || ''}" onclick="sortBy('${c[0]}')">${c[1]}${SK === c[0] ? (SD === 1 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '</tr>';
  const colorOf = k => (BUCKETS.find(b => b.k === k) || {}).color || '#8a94a6';
  $('tb').innerHTML = rs.slice(0, LIM).map(r => '<tr>' + COLS.map(c => {
    const v = r[c[0]];
    if (c[0] === 'bucketL') return `<td><span class="tag" style="background:${colorOf(r.bucket)}">${esc(v)}</span></td>`;
    if (c[0] === 'days') return `<td class="num"><b>${v == null ? '—' : v}</b></td>`;
    return `<td class="${c[2] || ''}">${esc(c[2] === 'num' && v !== '' ? fmt(v) : v)}</td>`;
  }).join('') + '</tr>').join('') || `<tr><td colspan="${COLS.length}" style="text-align:center;color:var(--mu);padding:24px">Koi data nahi</td></tr>`;
  $('cnt').textContent = `${fmt(rs.length)} rows (${fmt(rs.reduce((s, r) => s + r.qty, 0))} units)` + (NOEXP ? ` · ${NOEXP} rows me expiry date nahi hai` : '');
  $('more').style.display = rs.length > LIM ? '' : 'none';
}

function setB(k){ FB = (FB === k) ? 'all' : k; LIM = 300; draw(); }
function sortBy(k){ if (SK === k) SD = -SD; else { SK = k; SD = 1; } draw(); }
function resetF(){ $('q').value = ''; $('aud').value = ''; FB = 'all'; LIM = 300; draw(); }

// ---------- download (current filtered view) ----------
const HEAD = ['Shelf','EAN','MRP','Total QTY','MFG (MM/YYYY)','Expiry (MM/YYYY)','Shelf Life (Months)','Remaining Shelf Life (Days)','Status','Auditor','Bin ID','Scanned At'];
function dlRows(){
  return filtered().sort((x, y) => (x.days == null) - (y.days == null) || (x.days - y.days)).map(r =>
    [r.shelf, r.ean, r.mrp, r.qty, r.mfgT, r.expT, r.slife, r.days == null ? '' : r.days, r.bucketL, r.auditor, r.binId, r.tsT]);
}
function fname(ext){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `Remaining_Shelf_Life_${FB === 'all' ? 'All' : FB}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.${ext}`;
}
function save(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function dlCsv(){
  const rows = dlRows();
  if (!rows.length) return alert('Download ke liye data nahi hai.');
  const cell = (v, i) => {
    let s = String(v == null ? '' : v);
    if (i === 1) return '="' + s.replace(/"/g, '') + '"';        // EAN Excel me sci-notation na bane
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [HEAD.join(',')].concat(rows.map(r => r.map(cell).join(','))).join('\r\n');
  save(new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' }), fname('csv'));
}
function dlXlsx(){
  const rows = dlRows();
  if (!rows.length) return alert('Download ke liye data nahi hai.');
  if (typeof XLSX === 'undefined') return alert('Excel library load nahi hui — CSV download use karo.');
  const ws = XLSX.utils.aoa_to_sheet([HEAD].concat(rows));
  ws['!cols'] = HEAD.map((h, i) => ({ wch: i === 1 ? 16 : Math.max(10, h.length + 2) }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Shelf Life');
  XLSX.writeFile(wb, fname('xlsx'));
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
